  <use href="#gDot" x="39" y="26.3"/>
  <use href="#gDot" x="39" y="28.5"/><use href="#gDot" x="41.2" y="28.5"/><use href="#gDot" x="43.5" y="28.5"/>

  <!-- '3' (x: 46 to 50.5) -->
  <use href="#gDot" x="46" y="19.5"/><use href="#gDot" x="48.2" y="19.5"/><use href="#gDot" x="50.5" y="19.5"/>
  <use href="#gDot" x="50.5" y="21.7"/>
  <use href="#gDot" x="47.5" y="24.0"/><use href="#gDot" x="49.5" y="24.0"/>
