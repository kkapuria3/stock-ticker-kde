  <use href="#gDot" x="18.5" y="50.5"/>

  <!-- 'D' (x: 23.5 to 28) -->
  <use href="#gDot" x="23.5" y="41.5"/><use href="#gDot" x="25.7" y="41.5"/><use href="#gDot" x="27.5" y="41.5"/>
  <use href="#gDot" x="23.5" y="43.7"/><use href="#gDot" x="28" y="43.7"/>
  <use href="#gDot" x="23.5" y="46.0"/><use href="#gDot" x="28" y="46.0"/>
  <use href="#gDot" x="23.5" y="48.3"/><use href="#gDot" x="28" y="48.3"/>
  <use href="#gDot" x="23.5" y="50.5"/><use href="#gDot" x="25.7" y="50.5"/><use href="#gDot" x="27.5" y="50.5"/>

  <!-- 'A' (x: 30.5 to 35) -->
  <use href="#gDot" x="32.8" y="41.5"/>
  <use href="#gDot" x="31.5" y="43.7"/><use href="#gDot" x="34" y="43.7"/>
  <use href="#gDot" x="30.5" y="46.0"/><use href="#gDot" x="32.8" y="46.0"/><use href="#gDot" x="35" y="46.0"/>
  <use href="#gDot" x="30.5" y="48.3"/><use href="#gDot" x="35" y="48.3"/>
  <use href="#gDot" x="30.5" y="50.5"/><use href="#gDot" x="35" y="50.5"/>

  <!-- '1' (x: 40 to 42) -->
  <use href="#gDot" x="40.5" y="42.5"/>
  <use href="#gDot" x="42" y="41.5"/>
  <use href="#gDot" x="42" y="43.7"/>
  <use href="#gDot" x="42" y="46.0"/>
  <use href="#gDot" x="42" y="48.3"/>
  <use href="#gDot" x="42" y="50.5"/>

  <!-- '4' (x: 45.5 to 49.5) -->
  <use href="#gDot" x="45.5" y="41.5"/><use href="#gDot" x="49.5" y="41.5"/>
  <use href="#gDot" x="45.5" y="43.7"/><use href="#gDot" x="49.5" y="43.7"/>
  <use href="#gDot" x="45.5" y="46.0"/><use href="#gDot" x="47.5" y="46.0"/><use href="#gDot" x="49.5" y="46.0"/>
  <use href="#gDot" x="49.5" y="48.3"/>
  <use href="#gDot" x="49.5" y="50.5"/>

  <!-- '2' (x: 52.5 to 56.5) -->
