  <use href="#gDot" x="8.5" y="43.7"/><use href="#gDot" x="10" y="43.7"/><use href="#gDot" x="13.5" y="43.7"/>
  <use href="#gDot" x="8.5" y="46.0"/><use href="#gDot" x="11" y="46.0"/><use href="#gDot" x="13.5" y="46.0"/>
  <use href="#gDot" x="8.5" y="48.3"/><use href="#gDot" x="12" y="48.3"/><use href="#gDot" x="13.5" y="48.3"/>
